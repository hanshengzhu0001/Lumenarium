<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SceneProof</title>
  <style>
    body{font:16px system-ui;max-width:820px;margin:48px auto;padding:0 20px;color:#18202a}
    button,select,input{font:inherit;margin:8px 0;padding:10px}button{background:#1769e0;color:#fff;border:0;border-radius:6px}
    #status{background:#f4f6f8;padding:12px;border-radius:6px}.ok{color:#08783e}.warn{color:#a45b00}.bad{color:#b42318}
    progress{width:100%;height:18px;margin:12px 0}.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 18px}.stage{font-size:13px;padding:7px;text-align:center;background:#eef1f4;border-radius:5px}.stage.active{background:#d9e9ff;color:#0d55ad}.stage.done{background:#ddf4e7;color:#08783e}
    img{max-width:100%;border-radius:8px;margin-top:16px}small{color:#59636e}
  </style>
</head>
<body>
  <h1>SceneProof</h1>
  <p>Upload a 1024 x 1024 PNG/JPEG. New images run the complete S0-S4 pipeline.</p>
  <form id="form">
    <input name="image" type="file" accept="image/png,image/jpeg" required><br>
    <select name="profile">
      <option value="fast">V5-fast — frozen Fix61</option>
      <option value="medium" selected>V5-medium — Fix61 + visual-safe cleanup</option>
      <option value="best">V5-best — three cold V5-fast trials + GT-free selector</option>
    </select><br>
    <small>Identical images reuse the same frozen S0-S3 and Fix61 cache across profiles.</small><br>
    <label><input name="force_rerun" type="checkbox" value="true"> Re-run only the selected final profile (reuse frozen S0-S3/Fix61)</label><br>
    <label><input name="force_cold_rerun" id="force-cold-rerun" type="checkbox" value="true"> Force a new cold S0-S4 run (ignore frozen cache; slower)</label><br>
    <button>Generate scene</button>
  </form>
  <progress id="progress" max="100" value="0"></progress>
  <div class="stages" id="stages"></div>
  <p id="status">Ready</p><div id="output"></div>
  <script>
    const form=document.querySelector('#form'),status=document.querySelector('#status'),output=document.querySelector('#output'),bar=document.querySelector('#progress'),stageBox=document.querySelector('#stages');
    const stageDefs=[['s0','S0 Geometry'],['s1','S1 Parsing'],['s2','S2 Retrieval'],['s3','S3 Pose'],['s4','S4 Layout + Proof']];
    stageBox.innerHTML=stageDefs.map(([id,label])=>`<div class="stage" id="stage-${id}">${label}</div>`).join('');
    function stageGroup(name){if(name==='force_cold_rerun'||name.startsWith('S0_')||name.startsWith('s0_'))return's0';if(name.startsWith('S1_')||name.startsWith('s1_'))return's1';if(name.startsWith('S2_')||name.startsWith('s2_'))return's2';if(name.startsWith('S3_')||name.startsWith('s3_'))return's3';if(name.startsWith('s4_')||name==='render'||name==='packaging')return's4';return null}
    function paintStages(name,progress){const active=stageGroup(name),order=stageDefs.map(x=>x[0]),index=order.indexOf(active);stageDefs.forEach(([id])=>{const node=document.querySelector('#stage-'+id);node.className='stage'+(index>=0&&order.indexOf(id)<index?' done':id===active?' active':'')});if(name==='frozen_fix61_cache_hit'){['s0','s1','s2','s3'].forEach(id=>document.querySelector('#stage-'+id).className='stage done')}bar.value=Math.round(100*progress)}
    form.onsubmit=async event=>{event.preventDefault();output.innerHTML='';status.className='';
      const profile=form.querySelector('[name=profile]').value;
      if(profile==='best'&&!confirm('Run three independent cold V5-fast trials and select the best? Two A10 workers need about two cold-start rounds.'))return;
      if(profile!=='best'&&document.querySelector('#force-cold-rerun').checked&&!confirm('Run a completely new S0-S4 cold start? This ignores the frozen cache and can take 10-15 minutes per scene.'))return;
      const response=await fetch('/v1/jobs',{method:'POST',body:new FormData(form)}),body=await response.json();
      if(!response.ok){status.className='bad';status.textContent=JSON.stringify(body);return}
      const id=body.job.job_id;bar.value=0;paintStages('queued',0);status.textContent='Queued '+id;
      const timer=setInterval(async()=>{const job=await(await fetch('/v1/jobs/'+id)).json();paintStages(job.stage,job.progress);status.textContent=`${job.stage} — ${Math.round(100*job.progress)}%`;
        if(job.state==='succeeded'){clearInterval(timer);const result=job.result||{},quality=result.status||'unresolved',unresolved=result.unresolved_object_ids||[];
          status.className=['sparse_geometry_certified','certified'].includes(quality)?'ok':'warn';
          status.textContent=result.profile==='best'?'V5-best selected from three GT-free cold trials':(quality==='visual_salvaged'?'Visual-safe render completed (presentation only)':(['sparse_geometry_certified','certified'].includes(quality)?'Support contact certified':`Completed with unresolved objects: ${unresolved.join(', ')||'see evaluation.json'}`));
          output.innerHTML=`<img src="/v1/jobs/${id}/artifacts/render.png"><p><a href="/v1/jobs/${id}/artifacts/sceneproof-result.zip">Download result package</a></p>`}
        else if(['failed','cancelled'].includes(job.state)){clearInterval(timer);status.className='bad';status.textContent='Pipeline failed: '+(job.error||'unknown error')}} ,3000)};
  </script>
</body>
</html>
